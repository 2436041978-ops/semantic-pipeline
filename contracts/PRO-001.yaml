intent_id: "PRO-001"
description: "AI 执行多步任务时，用户无法判断当前处于什么认知阶段"
version: "1.0.0"
semantic_domain: "conversational"
applicable_products:
  - "Perplexity"
  - "秘塔搜索"
  - "Kimi"
  - "ChatGPT"
  - "Claude"

semantic_tokens:
  research:
    description: "AI 正在检索信息、查找来源"
    visual_mapping:
      color_token: "phase.research"
      motion_token: "magnifier.pulse"
      icon_token: "search"
    user_action:
      - "查看已找到的来源数量"
      - "等待检索完成"
    llm_constraints:
      - "必须显示'检索中'或'Searching'阶段标签"
      - "必须显示已找到的来源计数"
      - "禁止跳过此阶段直接显示最终答案"
  analysis:
    description: "AI 正在综合多源信息、识别分歧"
    visual_mapping:
      color_token: "phase.analysis"
      motion_token: "brain.thinking"
      icon_token: "brain"
    user_action:
      - "查看共识度指标"
      - "查看分歧来源"
    llm_constraints:
      - "必须显示'综合中'或'Analyzing'阶段标签"
      - "必须显示多源共识度（如'3/5 来源一致'）"
  check:
    description: "AI 正在核对链接、验证事实"
    visual_mapping:
      color_token: "phase.check"
      motion_token: "shield.verify"
      icon_token: "shield"
    user_action:
      - "查看验证状态"
      - "查看待核实项"
    llm_constraints:
      - "必须显示'验证中'或'Checking'阶段标签"
      - "必须标注验证通过/失败的来源"
  output:
    description: "AI 正在生成最终答案、输出结果"
    visual_mapping:
      color_token: "phase.output"
      motion_token: "document.write"
      icon_token: "document"
    user_action:
      - "查看引用索引"
      - "复制答案"
    llm_constraints:
      - "必须显示'生成中'或'Generating'阶段标签"
      - "必须附带引用索引，指向检索阶段来源"

immutable_boundaries:
  - boundary_type: "clarity"
    rule: "禁止用单一'思考中'文案覆盖所有认知阶段"
    violation_action: "block"
  - boundary_type: "semantic"
    rule: "禁止认知阶段标签与实际行动不符（如显示'验证中'但实际在检索）"
    violation_action: "block"
  - boundary_type: "consistency"
    rule: "禁止同一对话流中阶段标签前后不一致"
    violation_action: "warn"
