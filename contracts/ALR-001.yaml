intent_id: "ALR-001"
description: "告警文案中关键术语被 LLM 降级为低情绪权重同义词，导致用户忽略重要信息"
version: "1.0.0"
semantic_domain: "observational"
applicable_products:
  - "通用"
  - "AI 运维平台"
  - "系统监控"

semantic_tokens:
  critical:
    description: "关键告警：系统故障、数据丢失风险，需立即处理"
    visual_mapping:
      color_token: "status.critical"
      motion_token: "pulse.red.urgent"
      icon_token: "alert.octagon"
    user_action:
      - "立即查看详情"
      - "联系运维"
    llm_constraints:
      - "必须使用'Critical''致命''紧急'等高情绪权重词汇"
      - "禁止使用'严重''注意''提示'等降级同义词"
      - "必须提供具体故障定位和恢复指引"
  warning:
    description: "警告告警：限流、降级、可恢复异常，需关注但非立即"
    visual_mapping:
      color_token: "status.warning"
      motion_token: "static.yellow"
      icon_token: "alert.triangle"
    user_action:
      - "查看预计恢复时间"
      - "评估影响范围"
    llm_constraints:
      - "必须使用'Warning''警告'等中情绪权重词汇"
      - "禁止使用'注意''提醒'等降级同义词"
  info:
    description: "信息提示：功能更新、使用说明，可选择性关注"
    visual_mapping:
      color_token: "status.info"
      motion_token: "static.blue"
      icon_token: "info.circle"
    user_action:
      - "了解详情"
      - "忽略"
    llm_constraints:
      - "使用'Info''信息'等低情绪权重词汇"
      - "禁止滥用高情绪权重词汇"

immutable_boundaries:
  - boundary_type: "semantic"
    rule: "禁止将 Critical 降级为'严重''重要'等低情绪同义词"
    violation_action: "block"
  - boundary_type: "semantic"
    rule: "禁止将 Warning 降级为'注意''提醒'等低情绪同义词"
    violation_action: "block"
  - boundary_type: "clarity"
    rule: "禁止告警文案不含具体故障定位或恢复指引"
    violation_action: "warn"
