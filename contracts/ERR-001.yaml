intent_id: "ERR-001"
description: "流式输出中断，对话上下文可能丢失"
version: "1.0.0"
semantic_domain: "observational"
applicable_products:
  - "ChatGPT"
  - "文心一言"
  - "通义千问"
  - "Kimi"
  - "豆包"
  - "DeepSeek"
  - "讯飞星火"

semantic_tokens:
  fatal:
    description: "系统级故障，对话上下文可能已丢失，需立即处理"
    visual_mapping:
      color_token: "status.critical"
      motion_token: "pulse.red.urgent"
      icon_token: "octagon.warning"
    user_action:
      - "刷新页面"
      - "导出历史记录"
      - "联系客服"
    llm_constraints:
      - "必须明确告知用户'对话上下文可能已丢失'"
      - "必须提供恢复路径（刷新/导出/联系客服）"
      - "禁止使用'出错了'等模糊文案"
  transient:
    description: "网络抖动，系统可自动恢复，无需用户操作"
    visual_mapping:
      color_token: "status.neutral"
      motion_token: "spinner.gray"
      icon_token: "circle.loading"
    user_action:
      - "等待自动恢复"
      - "手动重试"
    llm_constraints:
      - "文案必须包含'正在恢复'或'请稍候'"
      - "禁止红色，避免用户恐慌"
  retryable:
    description: "请求频率超限，用户可自助恢复"
    visual_mapping:
      color_token: "status.warning"
      motion_token: "static.yellow"
      icon_token: "clock.countdown"
    user_action:
      - "等待倒计时结束"
      - "升级套餐"
    llm_constraints:
      - "必须显示倒计时或预计恢复时间"
      - "必须提供升级套餐的入口"
  degraded:
    description: "部分功能不可用，核心功能仍可继续"
    visual_mapping:
      color_token: "status.info"
      motion_token: "static.blue"
      icon_token: "info.circle"
    user_action:
      - "继续生成"
      - "简化问题重试"
    llm_constraints:
      - "必须说明哪些功能受影响、哪些可用"
      - "禁止阻断当前对话"

immutable_boundaries:
  - boundary_type: "semantic"
    rule: "禁止把多种错误状态做成同一种红色视觉表达"
    violation_action: "block"
  - boundary_type: "clarity"
    rule: "禁止仅显示'出错了''Something went wrong'等无后果说明的文案"
    violation_action: "block"
  - boundary_type: "safety"
    rule: "禁止fatal级别错误不提供用户恢复路径"
    violation_action: "block"
  - boundary_type: "consistency"
    rule: "禁止同一产品内不同错误级别共用同一文案模板"
    violation_action: "warn"
