intent_id: "BND-001"
description: "AI 拒绝请求或终止会话时，用户无法判断权利边界是否还在"
version: "1.0.0"
semantic_domain: "conversational"
applicable_products:
  - "Claude"
  - "ChatGPT"
  - "文心一言"
  - "Kimi"

semantic_tokens:
  soft:
    description: "软性拒绝：拒绝当前请求，但保留会话上下文，用户可继续对话"
    visual_mapping:
      color_token: "boundary.soft"
      motion_token: "static.yellow"
      icon_token: "hand.stop"
    user_action:
      - "修改请求后重试"
      - "继续其他话题"
    llm_constraints:
      - "必须明确说明'会话仍可继续'"
      - "必须保留用户输入框可用状态"
      - "必须提供替代建议（如'你可以尝试...'）"
  hard:
    description: "强制终止：终止当前会话，清空上下文，用户需开启新会话"
    visual_mapping:
      color_token: "boundary.hard"
      motion_token: "panel.exit"
      icon_token: "door.exit"
    user_action:
      - "导出当前对话"
      - "开启新会话"
    llm_constraints:
      - "必须明确说明'会话已终止，上下文已清空'"
      - "必须提供导出对话的入口"
      - "禁止伪装成软性拒绝（如保留输入框但不可提交）"
  review:
    description: "升级审核：请求已提交人工审核，等待结果"
    visual_mapping:
      color_token: "boundary.review"
      motion_token: "static.blue"
      icon_token: "hourglass"
    user_action:
      - "查看预计审核时间"
      - "取消请求"
    llm_constraints:
      - "必须显示预计审核时间"
      - "必须提供取消请求的入口"
      - "禁止暗示审核已通过或已拒绝"

immutable_boundaries:
  - boundary_type: "semantic"
    rule: "禁止软性拒绝和强制终止使用同一视觉表达"
    violation_action: "block"
  - boundary_type: "safety"
    rule: "禁止强制终止不告知用户上下文已清空"
    violation_action: "block"
  - boundary_type: "clarity"
    rule: "禁止边界动作不提供用户下一步行动指引"
    violation_action: "warn"
