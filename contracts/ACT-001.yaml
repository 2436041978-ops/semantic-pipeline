intent_id: "ACT-001"
description: "不可逆操作按钮未按危险级别约束，用户可能误触导致数据永久丢失"
version: "1.0.0"
semantic_domain: "transactional"
applicable_products:
  - "通用"
  - "v0"
  - "Claude Code"
  - "ChatGPT"

semantic_tokens:
  destructive:
    description: "破坏性操作：删除、清空、注销等不可逆行为"
    visual_mapping:
      color_token: "action.destructive"
      button_style: "outline_danger"
      icon_token: "trash.warning"
    user_action:
      - "输入账户名二次确认"
      - "阅读后果说明"
      - "取消操作"
    llm_constraints:
      - "必须使用红色空心描边样式，禁止蓝色实心"
      - "必须包含二次确认弹窗"
      - "文案必须明确说明'此操作不可恢复'"
      - "必须禁用快速双击提交"
  constructive:
    description: "建设性操作：保存、提交、创建等正向行为"
    visual_mapping:
      color_token: "action.constructive"
      button_style: "solid_primary"
      icon_token: "check.circle"
    user_action:
      - "确认提交"
      - "查看成功反馈"
    llm_constraints:
      - "使用品牌色实心按钮"
      - "操作后必须提供成功反馈"
  neutral:
    description: "中性操作：取消、关闭、返回等无后果行为"
    visual_mapping:
      color_token: "action.neutral"
      button_style: "ghost"
      icon_token: "x.circle"
    user_action:
      - "取消当前操作"
      - "返回上一步"
    llm_constraints:
      - "使用灰色描边或幽灵按钮"
      - "禁止与破坏性操作视觉权重相同"

immutable_boundaries:
  - boundary_type: "safety"
    rule: "禁止直接执行删除操作而不显示二次确认"
    violation_action: "block"
  - boundary_type: "safety"
    rule: "禁止破坏性操作按钮与普通操作按钮样式相同"
    violation_action: "block"
  - boundary_type: "clarity"
    rule: "禁止二次确认弹窗使用模糊文案（如'确定吗？'）"
    violation_action: "block"
  - boundary_type: "consistency"
    rule: "禁止同一产品内不同级别的destructive操作使用不同确认强度"
    violation_action: "warn"
